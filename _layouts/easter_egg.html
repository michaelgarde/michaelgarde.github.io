---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: radial-gradient(circle, #1a1a2e, #16213e, #0f3460);
            color: #ffd700;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .egg-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            position: relative;
        }
        
        .egg-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 15px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .egg-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .egg-content {
            line-height: 1.8;
            position: relative;
            z-index: 1;
        }
        
        .egg-footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            border-top: 2px solid #ffd700;
        }
        
        .back-link {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        
        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700; }
            to { text-shadow: 0 0 20px #ffd700, 0 0 30px #ffd700, 0 0 40px #ffd700; }
        }
    </style>
</head>
<body>
    <div class="egg-container">
        <div class="egg-header">
            <h1 class="glow-text">🥚 {{ page.title }}</h1>
            <p>Easter Egg #{{ page.egg_number | default: "???" }}</p>
            <p><em>You found a secret!</em></p>
        </div>
        
        <div class="egg-content">
            {{ content }}
        </div>
        
        <div class="egg-footer">
            <a href="/" class="back-link">🏠 Back to the Playground</a>
        </div>
    </div>
    
    <script>
        // Create floating particles
        function createParticles() {
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.5;
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 6000);
            }, 300);
        }
        
        // Easter egg counter
        function incrementEggCounter() {
            const currentCount = parseInt(localStorage.getItem('eggsFound') || '0');
            localStorage.setItem('eggsFound', currentCount + 1);
            
            // Update counter on homepage if it exists
            const counter = document.getElementById('egg-counter');
            if (counter) {
                counter.textContent = currentCount + 1;
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            incrementEggCounter();
        });
    </script>
</body>
</html>
